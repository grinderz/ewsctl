[project]
name = "ewsctl"
version = "0.1.0"
description = "CLI for Exchange over EWS: server-side inbox rules and friends"
requires-python = ">=3.12"
dependencies = ["exchangelib>=5.6"]

[project.scripts]
ewsctl = "ewsctl:main"

[dependency-groups]
dev = ["ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["ewsctl.py"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET"]

[tool.mypy]
files = ["ewsctl.py"]
ignore_missing_imports = true
